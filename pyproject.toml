[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cytogate"
version = "0.0.1"
description = "Personal flow cytometry analysis desktop app with FlowJo-compatible outputs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "flowio>=1.3",
    "flowutils>=1.1",
    "flowkit>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.gui-scripts]
cytogate = "cytogate.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
