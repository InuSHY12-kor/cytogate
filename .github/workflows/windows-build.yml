name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # attach the zip to a GitHub Release for v* tags

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev,build]"

      - name: Test
        run: |
          python scripts/fetch_test_data.py
          pytest -q -p no:cacheprovider

      - name: Build CytoGate.exe
        run: pyinstaller packaging/cytogate.spec --noconfirm

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CytoGate\CytoGate.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode))" }

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $v = python -c "import cytogate; print(cytogate.__version__)"
          $name = "CytoGate-$v-windows-x64.zip"
          Compress-Archive -Path dist\CytoGate -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: CytoGate-windows-x64
          path: |
            ${{ steps.zip.outputs.name }}
            selftest.txt

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.name }}
          generate_release_notes: true
